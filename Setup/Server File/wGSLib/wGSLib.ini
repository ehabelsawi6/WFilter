[GameServer]

;Default = Driver={SQL Server};SERVER=DESKTOP-5HUFH66\SQLEXPRESS;Trusted_Connection=true;DATABASE=PHOENIX_FILTER_CONTENT_DB;Timeout=5;
FilterDbConnStr=Driver={SQL Server};SERVER=DESKTOP-5HUFH66\SQLEXPRESS;Trusted_Connection=true;DATABASE=wFilter;Timeout=5;

;Unique gameserver identifier, used for example for _OnGameServerStarted procedure call and for 
;spawning monsters from _InstantMobSpawnAtPosDelivery table.
ServerID=1

;Maximum character level
;Default = 110
MaxCharLevel=110

;Maximum pet level
;Default = 110
MaxPetLevel=110

;Maximum Chinese mastery level (total)
;Default = 330
MaxChinaMasteryLevel=330

;Maximum European mastery level (total)
;Default = 240
MaxEuropeMasteryLevel=240

;Enables or disables the rates limit
;Default = True
BypassRatesLimit=True

;Enables or disables the fix for null GObj instance crash on EnterWorld.
;Default = True
EnableNullInstanceFix=True

;Enables or disables the BSObj and other message box redirection (they will appear in the addon CLI)
;Default = False
RedirectMessageBoxes=True

;Enables or disables the quest raise event msg
;Default = False
DisableQuestRaiseEventMsg=True

[DbTriggerActions]

;The DB poll interval, in milliseconds.
DbPollInterval=1000

;Enables or disables the instant damage delivery (_InstantDmgDelivery table)
;Default = False
DeliverDamage=True

;Enables or disables the instant item delivery (_InstantItemDelivery table)
;Default = False
DeliverItems=True

;Enables or disables the instant gold delivery (_InstantGoldDelivery table)
;Default = False
DeliverGold=True

;Enables or disables the instant teleports delivery (_InstantTeleportDelivery table)
;Default = False
DeliverTeleports=True

;Enables or disables the instant skill point delivery (_InstantSkillPointDelivery)
;Default = False
DeliverSkillPoints=True

;Enables or disables experience delivery (_InstantExperience)
;Default = False
DeliverExperience=True

;Enables or disables char reload delivery (_InstantCharReloadDelivery), normally used for auto-equipment
;Default = False
DeliverInstantCharReload=True

;Enables or disables instant pvp state delivery (_InstantPvpStateDelivery)
;Default = False
DeliverPvpState=True

;Enables or disables instant stat point delivery (_InstantStatPointDelivery)
;Default = False
DeliverStatPoint=True

;Enables or disables instant hwan level delivery (_InstantHwanLevelDelivery)
;Default = False
DeliverHwanLevel=True

;Enables or disables instant mob spawn near players (_InstantMobSpawnNerPlayerDelivery)
;Default = False
DeliverMobSpawnNearPlayer=True

;Enables or disables instant mob spawn at positions (_InstantMobSpawnAtPosDelivery)
;Default = False
DeliverMobSpawnAtPos=True

;Enables or disables instant buff delivery (_InstantBuffsDelivery)
;Default = False
DeliverBuffs=True

;Enables or disables instant berserker delivery (_InstantZerkDelivery)
;Default = False
DeliverZerk=True

;Enables or disables instant silk delivery (_InstantSilkDelivery)
;Default = False
DeliverSilk=True

;Enables or disables instant delivery delay report msg (monitoring purposes)
;Default = True
EnableDelayReportMsg=False

[FlagWorld]
;Reward codename for killing player while in flag world
;Default = ITEM_ETC_E080723_ICETROPHY
KillRewardCodename=ITEM_ETC_E080723_ICETROPHY

;Reward count for killing player while in flag world
;Default = 1
KillRewardCount=1

;Reward codename for winning flag world event
;Default = ITEM_ETC_E080723_ICETROPHY
WinRewardCodename=ITEM_ETC_E080723_ICETROPHY

;Reward count for winning flag world event
;Default = 1
WinRewardCount=1

[BattleArena]
;Reward codename for winning battle arena
;Default = ITEM_ETC_ARENA_COIN
RewardCodename=ITEM_ETC_ARENA_COIN

;Reward count for winning battle arena event while on job or guild
;Default = 7
GuildAndJobWinRewardCount=7

;Reward count for losing battle arena event while on job or guild
;Default = 2
GuildAndJobLoseRewardCount=2

;Reward count for winning battle arena event while in a party or random
;Default = 5
PartyAndRandomWinRewardCount=5

;Reward count for losing battle arena event while in party or random
;Default = 1
PartyAndRandomLoseRewardCount=1